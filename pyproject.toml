[project]
name = "ai-quant-trader"
version = "0.1.0"
description = "Paper-first algorithmic trading platform with IBKR adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.52,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=6,<7",
  "structlog>=25,<26",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "aiosqlite>=0.20,<1",
  "fakeredis[lua]>=2.26",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*", "core*", "database*"]
exclude = ["tests*", "vendor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep the reproducible project baseline independent of user-wide Ruff config.
select = ["E4", "E7", "E9", "F"]
